name: release

# Publica las imágenes de producción en GHCR al empujar un tag de versión:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# Sale ghcr.io/<dueño>/sac-st:0.1.0 (php-fpm) y sac-st-web:0.1.0 (nginx).
# En el servidor, la versión se elige en /etc/sacst/compose.env.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

# Dos tags seguidos no se pisan publicando a la vez.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  images:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve names
        id: meta
        # GHCR exige el dueño en minúscula; el tag de git lleva la «v» y la
        # etiqueta de la imagen no.
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "app=ghcr.io/${owner}/sac-st:${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${owner}/sac-st-web:${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Las dos imágenes se construyen y se prueban antes de publicar
      # cualquiera: si una falla, no queda en GHCR una versión a medias.
      - name: Build app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: app
          load: true
          tags: ${{ steps.meta.outputs.app }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: web
          load: true
          tags: ${{ steps.meta.outputs.web }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha

      - name: Smoke test
        env:
          APP_IMAGE: ${{ steps.meta.outputs.app }}
          WEB_IMAGE: ${{ steps.meta.outputs.web }}
        # Sin base ni entorno: que las extensiones estén, que Laravel arranque
        # con las rutas completas, que el front esté compilado y que la
        # configuración de nginx sea válida.
        run: |
          docker run --rm --entrypoint php "$APP_IMAGE" -r '
            foreach (["pdo_pgsql", "intl", "gd", "exif", "zip", "bcmath", "pcntl", "Zend OPcache"] as $e) {
              if (! extension_loaded($e)) { fwrite(STDERR, "falta $e\n"); exit(1); }
            }
            // GD compila igual sin libwebp: sin esto, la falta aparece recién
            // con la primera foto que se sube.
            if ((imagetypes() & IMG_WEBP) === 0) { fwrite(STDERR, "GD sin WebP\n"); exit(1); }'
          docker run --rm --entrypoint php "$APP_IMAGE" artisan route:list --path=up
          docker run --rm --entrypoint test "$APP_IMAGE" -f public/build/manifest.json
          docker run --rm --add-host app:127.0.0.1 -e SACST_DC_PROXY_IP=192.0.2.10 "$WEB_IMAGE" nginx -t

      - name: Push images
        env:
          APP_IMAGE: ${{ steps.meta.outputs.app }}
          WEB_IMAGE: ${{ steps.meta.outputs.web }}
        run: |
          docker push "$APP_IMAGE"
          docker push "$WEB_IMAGE"
