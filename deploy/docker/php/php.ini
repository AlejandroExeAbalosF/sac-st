; PHP de producción para SAC-ST. Se carga como conf.d/zz-sacst.ini.

; ─── Superficie ───────────────────────────────────────────────────────────
expose_php = Off
cgi.fix_pathinfo = 0

; ─── Límites ──────────────────────────────────────────────────────────────
; Los extractos del banco llegan en planillas de varios meses, y leerlas con
; PhpSpreadsheet pide memoria. Los mismos valores que en desarrollo, para no
; descubrir en producción que un archivo que allá entraba acá no entra.
memory_limit = 512M
max_execution_time = 120
upload_max_filesize = 32M
; Un poco más que la subida, para que los demás campos del formulario entren.
post_max_size = 33M
max_file_uploads = 20

; ─── Errores ──────────────────────────────────────────────────────────────
; Al log (stderr → journald), nunca a la respuesta.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; ─── OPcache ──────────────────────────────────────────────────────────────
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; El código no cambia dentro de la imagen: una versión nueva es un contenedor
; nuevo, con OPcache vacío. Revalidar sería trabajo sin sentido.
opcache.validate_timestamps = 0

; ─── Hora ─────────────────────────────────────────────────────────────────
; Se guarda en UTC y se muestra en Salta: la conversión la hace la app
; (APP_DISPLAY_TIMEZONE). En desarrollo este valor es la hora de Salta; acá
; no, para que PHP, la base y journald hablen el mismo reloj.
date.timezone = UTC
