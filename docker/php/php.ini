; Ajustes de desarrollo para SAC-ST.

; Los tests de arquitectura reflejan todas las clases de `app/Modules` de
; una vez, y phpstan analiza el proyecto entero: 128 MB no alcanzan. El
; mismo valor que declara phpunit.xml.
memory_limit = 512M

; Los extractos del banco llegan en planillas; 2 MB del default se quedan
; cortos apenas el archivo trae un par de meses.
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 120

; En desarrollo el código cambia todo el tiempo: opcache tiene que releer
; los archivos en cada pedido o se sirven versiones viejas.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

date.timezone = America/Argentina/Salta

display_errors = On
error_reporting = E_ALL
